<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </radialGradient>
    
    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6c87e" />
      <stop offset="50%" stop-color="#d98f32" />
      <stop offset="100%" stop-color="#9a5a18" />
    </linearGradient>
    
    <linearGradient id="goldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a5a18" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>

    <!-- Hair/Details Gradient -->
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2a29" />
      <stop offset="100%" stop-color="#141212" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="500" rx="32" fill="url(#bgGrad)" />
  
  <!-- Glowing Golden Orbit rings -->
  <circle cx="250" cy="250" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="10 15" opacity="0.3" />
  <circle cx="250" cy="250" r="150" fill="none" stroke="url(#goldAccent)" stroke-width="2" opacity="0.4" />
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="5 10" opacity="0.2" />

  <!-- Code elements floating in background -->
  <text x="60" y="120" font-family="monospace" font-size="14" fill="#f6c87e" opacity="0.25">&lt;div class="dev"&gt;</text>
  <text x="80" y="150" font-family="monospace" font-size="14" fill="#f6c87e" opacity="0.15">const skill = "Next.js";</text>
  <text x="80" y="180" font-family="monospace" font-size="14" fill="#f6c87e" opacity="0.15">const role = "SE Intern";</text>
  <text x="60" y="210" font-family="monospace" font-size="14" fill="#f6c87e" opacity="0.25">&lt;/div&gt;</text>

  <text x="320" y="320" font-family="monospace" font-size="14" fill="#d98f32" opacity="0.25">import React from 'react';</text>
  <text x="320" y="350" font-family="monospace" font-size="14" fill="#d98f32" opacity="0.15">export default Elly;</text>

  <!-- Stylized Female Headshot Portrait Vector -->
  <!-- Glowing Background halo for avatar -->
  <circle cx="250" cy="240" r="95" fill="url(#goldGrad)" opacity="0.15" filter="url(#glow)" />
  
  <!-- Outer Ring -->
  <circle cx="250" cy="245" r="115" fill="none" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)" />

  <g transform="translate(0, 20)">
    <!-- Shoulders/Clothes -->
    <path d="M150,380 C150,320 200,290 250,290 C300,290 350,320 350,380 Z" fill="url(#darkGrad)" stroke="url(#goldGrad)" stroke-width="1.5" />
    <path d="M220,290 L250,335 L280,290 Z" fill="#e7c393" /> <!-- V-neck skin -->
    <path d="M205,305 L250,365 L295,305 Z" fill="none" stroke="url(#goldAccent)" stroke-width="2" opacity="0.8" /> <!-- Neckline detail -->

    <!-- Neck -->
    <rect x="232" y="240" width="36" height="60" rx="10" fill="#e7c393" />

    <!-- Head / Face -->
    <rect x="205" y="155" width="90" height="105" rx="45" fill="#fce5cd" stroke="#e7c393" stroke-width="1" />

    <!-- Cute Glasses -->
    <circle cx="228" cy="205" r="20" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="272" cy="205" r="20" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
    <line x1="248" y1="205" x2="252" y2="205" stroke="url(#goldGrad)" stroke-width="3" />
    <line x1="208" y1="205" x2="198" y2="208" stroke="url(#goldGrad)" stroke-width="2" />
    <line x1="292" y1="205" x2="302" y2="208" stroke="url(#goldGrad)" stroke-width="2" />

    <!-- Eyes (simple closed/happy or dots behind glasses) -->
    <circle cx="228" cy="205" r="3" fill="#141212" />
    <circle cx="272" cy="205" r="3" fill="#141212" />

    <!-- Smile -->
    <path d="M242,232 Q250,239 258,232" fill="none" stroke="#9a5a18" stroke-width="2.5" stroke-linecap="round" />

    <!-- Hair (Stylish dark bob with gold highlights) -->
    <!-- Back Hair -->
    <path d="M190,180 C180,220 185,270 200,285 C205,270 205,190 205,180 Z" fill="#141212" />
    <path d="M310,180 C320,220 315,270 300,285 C295,270 295,190 295,180 Z" fill="#141212" />
    <!-- Front Hair/Bangs -->
    <path d="M200,165 C220,135 280,135 300,165 C315,190 310,250 310,265 C300,260 292,230 292,210 C270,165 230,165 208,210 C208,230 200,260 190,265 C190,250 185,190 200,165 Z" fill="url(#darkGrad)" />
    <!-- Hair Highlight -->
    <path d="M210,158 C230,140 270,140 290,158" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.7" stroke-linecap="round" />
  </g>

  <!-- Outer frame border with corner notches -->
  <rect x="15" y="15" width="470" height="470" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.25" />
</svg>
